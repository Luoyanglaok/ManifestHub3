name: 🎮 Request new App ID
description: Request that a Steam game be added to the ManifestHub database.
title: "Add App <AppID> — <Game Name>"
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for requesting a new App ID! Please fill in the details below.
        New App IDs are usually added within a few days.

        💡 You can also request directly on our
        [Discord](https://discord.com/invite/FDKpJu5zgT).

  - type: input
    id: appid
    attributes:
      label: Steam App ID
      description: The numeric App ID from the Steam store URL (e.g. 400 for Portal).
      placeholder: "400"
    validations:
      required: true

  - type: input
    id: gamename
    attributes:
      label: Game Name
      description: The name of the game as it appears on the Steam store.
      placeholder: "Portal"
    validations:
      required: true

  - type: input
    id: steamurl
    attributes:
      label: Steam Store URL
      description: Link to the game's Steam store page.
      placeholder: "https://store.steampowered.com/app/400/Portal/"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: App Type
      options:
        - Game
        - DLC
        - Demo
        - Tool / Utility
        - Soundtrack
        - Other
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Anything else we should know (branch preferences, specific versions, etc.).
    validations:
      required: false
