name: 🔧 Report broken file
description: Report a corrupt, empty, or missing file for an existing App ID.
title: "Broken: App <AppID> — <Problem>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please tell us which App ID is broken and what
        happened. This helps us fix the data quickly.

  - type: input
    id: appid
    attributes:
      label: Steam App ID
      description: The numeric App ID that has the problem.
      placeholder: "400"
    validations:
      required: true

  - type: input
    id: gamename
    attributes:
      label: Game Name
      placeholder: "Portal"
    validations:
      required: true

  - type: dropdown
    id: filetype
    attributes:
      label: Which file is broken?
      options:
        - Lua file (.lua)
        - Key file (key.vdf)
        - ZIP download
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: |
        Describe the issue. For example: file is empty, download fails,
        SteamTools shows an error, game doesn't appear, etc.
        Include any error messages you saw.
      placeholder: "The ZIP downloaded but key.vdf was empty (0 bytes)..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How did you encounter the problem?
      placeholder: |
        1. Went to steamtools.games
        2. Searched for "Portal"
        3. Clicked Download ZIP
        4. Extracted and found key.vdf was empty
    validations:
      required: true
