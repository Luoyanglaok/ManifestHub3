# Validates repository integrity on every push/PR to main.
# Checks:
#   1. Every file on main is expected (README, LICENSE, etc.)
#   2. Archive JSON files are valid JSON (if present)
#   3. llms.txt and CONTRIBUTING.md exist and are non-empty
#
# Note: Per-branch content (lua/vdf) is NOT validated here because
# GitHub Actions only checks out the target branch. Branch content
# validation should be done by the website at runtime (see
# steamtools.games/src/modules/zip/service.ts).

name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -e
          for f in README.md LICENSE llms.txt CONTRIBUTING.md SECURITY.md .gitignore; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "❌ File is empty: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Validate archive JSON files (if present)
        run: |
          set -e
          if [ -f archive/depotkeys.json ]; then
            echo "Validating archive/depotkeys.json..."
            # Use jq to parse — fails on invalid JSON
            jq 'length' archive/depotkeys.json > /dev/null
            echo "✅ depotkeys.json is valid JSON"
          fi
          if [ -f archive/appaccesstokens.json ]; then
            echo "Validating archive/appaccesstokens.json..."
            jq 'length' archive/appaccesstokens.json > /dev/null
            echo "✅ appaccesstokens.json is valid JSON"
          fi

      - name: Check for unexpected files on main
        run: |
          set -e
          # List of expected files/dirs on main branch
          expected=(
            ".gitignore"
            "CONTRIBUTING.md"
            "LICENSE"
            "README.md"
            "SECURITY.md"
            "llms.txt"
            "og-home.png"
            "archive"
          )
          # Get all tracked files (top-level only)
          mapfile -t tracked < <(git ls-files -- '/' | cut -d/ -f1 | sort -u)
          for f in "${tracked[@]}"; do
            if [[ ! " ${expected[*]} " =~ " ${f} " ]]; then
              echo "⚠️  Unexpected file/dir on main: $f"
              echo "   If this is intentional, add it to the expected list in .github/workflows/validate.yml"
            fi
          done
          echo "✅ File structure check complete"

      - name: Verify no JSON data files on main root
        run: |
          set -e
          if ls *.json 1>/dev/null 2>&1; then
            echo "❌ JSON data files found in repo root!"
            echo "   depotkeys.json and appaccesstokens.json belong in archive/"
            echo "   Found: $(ls *.json)"
            exit 1
          fi
          echo "✅ No JSON data files in repo root"
